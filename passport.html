<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cellvage Passport</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#F2F4F7;--surface:#FFFFFF;--surface-2:#F7F8FA;--ink:#111821;--muted:#5A6472;--faint:#8892A0;--line:#E0E4EA;--accent:#2148C0;
--ok:#16753E;--ok-bg:#E3F3E9;--bad:#B0291C;--bad-bg:#FBE8E5;--warn:#965A06;--warn-bg:#FBF2E2;--gA:#16753E;--gB:#2148C0;--gC:#965A06;--gR:#B0291C;
--f:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--m:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1117;--surface:#141B24;--surface-2:#19222D;--ink:#E6EBF1;--muted:#9BA6B5;--faint:#6E7988;--line:#243041;--accent:#8AA4FF;
--ok:#5DCB8C;--ok-bg:#12281B;--bad:#F07462;--bad-bg:#331814;--warn:#E6AA45;--warn-bg:#2D2312;--gA:#5DCB8C;--gB:#8AA4FF;--gC:#E6AA45;--gR:#F07462;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1117;--surface:#141B24;--surface-2:#19222D;--ink:#E6EBF1;--muted:#9BA6B5;--faint:#6E7988;--line:#243041;--accent:#8AA4FF;
--ok:#5DCB8C;--ok-bg:#12281B;--bad:#F07462;--bad-bg:#331814;--warn:#E6AA45;--warn-bg:#2D2312;--gA:#5DCB8C;--gB:#8AA4FF;--gC:#E6AA45;--gR:#F07462;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f)}
.wrap{max-width:520px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1rem;letter-spacing:-.01em;padding:6px 2px 14px}
.brand i{width:11px;height:19px;border-radius:3px;border:2px solid var(--ink);position:relative;display:inline-block}
.brand i::after{content:"";position:absolute;left:1px;right:1px;bottom:1px;height:60%;background:var(--ok);border-radius:1px}
.brand i::before{content:"";position:absolute;left:2px;right:2px;top:-5px;height:3px;background:var(--ink);border-radius:1px}
.brand span{margin-left:auto;font:600 .7rem var(--m);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
.status{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:14px 16px;margin-bottom:12px}
.status.ok{background:var(--ok-bg);color:var(--ok)}.status.bad{background:var(--bad-bg);color:var(--bad)}.status.wait{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.status .ic{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.status.ok .ic{background:var(--ok)}.status.bad .ic{background:var(--bad)}
.status b{display:block;font-size:1rem}
.status p{margin:2px 0 0;font-size:.86rem;color:var(--ink);opacity:.85}
.pid{font:700 .8rem var(--m);color:var(--muted);letter-spacing:.02em}
.cell{font-weight:800;font-size:1.5rem;letter-spacing:-.02em;margin-top:2px}
.sub{color:var(--muted);font-size:.88rem}
.hero{display:flex;align-items:center;gap:18px;margin-top:16px}
.gauge{position:relative;width:118px;height:118px;flex:none}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .pct{font-weight:800;font-size:2.2rem;line-height:1;letter-spacing:-.03em}
.gauge .pct small{font-size:.95rem}
.gauge .lbl{font:600 .6rem var(--m);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.chip{display:inline-block;font-weight:700;font-size:.8rem;padding:4px 10px;border-radius:999px;color:#fff}
.tag{display:inline-block;font:600 .62rem var(--m);letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--warn-bg);color:var(--warn);margin-left:4px;vertical-align:middle}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.verdict h2{font-size:1.08rem;margin:8px 0 2px;line-height:1.3}
.verdict p{margin:0;color:var(--muted);font-size:.84rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.tile{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.tile .k{font-size:.74rem;color:var(--muted);font-weight:600}
.tile .val{font-weight:800;font-size:1.3rem;letter-spacing:-.01em;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .val small{font-weight:600;font-size:.76rem;color:var(--muted);margin-left:2px}
h3{font:600 .7rem var(--m);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 14px;font-size:.88rem}
dt{color:var(--muted)}dd{margin:0;text-align:right;overflow-wrap:anywhere}
.hash{font:500 .74rem/1.45 var(--m);overflow-wrap:anywhere;color:var(--ink)}
.trail{list-style:none;margin:0;padding:0}
.trail li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px}
.trail .dot{display:flex;flex-direction:column;align-items:center}
.trail .dot i{width:12px;height:12px;border-radius:50%;background:var(--ok);margin-top:5px}
.trail .dot i.o{background:transparent;border:2px solid var(--faint)}
.trail .dot b{flex:1;width:2px;background:var(--line);min-height:16px}
.trail .tx{padding-bottom:12px;font-size:.9rem}
.trail .tx small{display:block;color:var(--muted);font-size:.8rem}
button{font:600 .9rem var(--f);padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;width:100%}
.note{font-size:.8rem;color:var(--muted);margin:10px 2px 0}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
</style>
</head>

  <div id="app"><div class="status wait"><div><b>Checking passport…</b></div></div></div>
</div>

<script>
const $ = s => document.querySelector(s);
const dec = new TextDecoder();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const b64u = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
const enc = new TextEncoder();
const GRADE = { A: ['var(--gA)', 'Reuse grade A', 'Healthy. Fit for second-life packs.'], B: ['var(--gB)', 'Reuse grade B', 'Good. Suitable for light-duty packs.'], C: ['var(--gC)', 'Reuse grade C', 'Worn. Low-power use only.'], R: ['var(--gR)', 'Recycle', 'Too worn to reuse. Material recovery.'] };
const FAM = { 'NMC-2600': '18650 laptop cell · 2600 mAh', 'NMC-2500HD': '18650 high-drain cell · 2500 mAh' };
const when = iso => new Date(iso).toLocaleString(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
let P = null, tampered = false;

function parse() {
  const h = location.hash.replace(/^#/, ''), parts = h.split('.');
  if (parts.length !== 4 || parts[0] !== 'v1') return null;
  try { const msg = b64u(parts[1]); return { msg, sig: b64u(parts[2]), pub: b64u(parts[3]), body: JSON.parse(dec.decode(msg)) }; } catch (e) { return null; }
}
function render() {
  if (!P) { $('#app').innerHTML = `<div class="card empty"><b style="color:var(--ink)">No passport in this link</b><p>Scan the QR code on a Cellvage test result.</p></div>`; return; }
  const body = tampered ? Object.assign({}, P.body, { h: Math.min(99, P.body.h + 17), g: 'A' }) : P.body;
  const msg = tampered ? enc.encode(JSON.stringify(body)) : P.msg;
  const ok = PPCrypto.verify(P.sig, msg, P.pub);
  const hash = PPCrypto.sha256hex(msg), kfp = PPCrypto.sha256hex(P.pub).slice(0, 16);
  const b = body, G = GRADE[b.g] || GRADE.R, r = 50, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, b.h / 100));
  $('#app').innerHTML = `
  <div class="status ${ok ? 'ok' : 'bad'}"><div class="ic">${ok ? '✓' : '✕'}</div><div><b>${ok ? 'Genuine passport' : 'Passport has been altered'}</b>
    <p>${ok ? `Signed by rig ${esc(b.rg)} (key ${kfp.slice(0, 8)}…). Nothing has been changed since it was issued.` : 'The contents no longer match the rig’s signature. Do not trust these numbers.'}</p></div></div>
  <div class="card">
    <div class="pid">${esc(b.id)}</div>
    <div class="cell">${esc(b.c)}</div>
    <div class="sub">${esc(FAM[b.f] || b.f)}</div>
    <div class="hero">
      <div class="gauge"><svg viewBox="0 0 118 118" aria-hidden="true"><circle cx="59" cy="59" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="59" cy="59" r="${r}" fill="none" stroke="${G[0]}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(c * f).toFixed(1)} ${c.toFixed(1)}"/></svg>
        <div class="v"><div class="pct">${Math.round(b.h)}<small>%</small></div><div class="lbl">Health</div></div></div>
      <div class="verdict"><span class="chip" style="background:${G[0]}">${G[1]}</span>${b.b === 'ref' ? '<span class="tag ok">vs new cell</span>' : '<span class="tag">indicative</span>'}
        <h2>${G[2]}</h2><p>Likely range ${Math.round(b.lo)}–${Math.round(b.hi)}%</p></div>
    </div>
    <div class="tiles">
      <div class="tile"><div class="k">Voltage at rest</div><div class="val">${(+b.v0).toFixed(3)}<small>V</small></div></div>
      <div class="tile"><div class="k">Internal resistance</div><div class="val">${Math.round(b.r0)}<small>mΩ</small></div></div>
      <div class="tile"><div class="k">After 5 s pulse</div><div class="val">${Math.round(b.r5)}<small>mΩ</small></div></div>
      <div class="tile"><div class="k">Pulse current</div><div class="val">${(+b.i).toFixed(2)}<small>A</small></div></div>
    </div>
  </div>
  <div class="card"><h3>History</h3><ul class="trail">
    <li><span class="dot"><i></i><b></b></span><span class="tx">Pulse-tested on rig ${esc(b.rg)}<small>${when(b.t)} · ${b.n} samples at 50 Hz</small></span></li>
    <li><span class="dot"><i></i><b></b></span><span class="tx">Passport issued and signed<small>${when(b.is)}</small></span></li>
    <li><span class="dot"><i class="o"></i></span><span class="tx" style="color:var(--muted)">Next owner<small>Scan again after resale to check it</small></span></li>
  </ul></div>
  <div class="card"><h3>Proof</h3><dl>
    <dt>Passport hash</dt><dd class="hash">${hash}</dd>
    <dt>Previous passport</dt><dd class="hash">${esc(b.pv)}</dd>
    <dt>Test data hash</dt><dd class="hash">${esc(b.dh)}</dd>
    <dt>Rig key</dt><dd class="hash">${kfp}</dd>
    <dt>Rig program</dt><dd>${esc(b.fw)}</dd>
  </dl>
  <p class="note">The signature proves this passport came from that rig and has not been edited. The test data hash ties it to the rig’s saved measurement log.${b.b === 'ref' ? '' : ' Health is an indicative model estimate; the voltages, currents and resistances are measured.'}</p></div>
  <button id="tamper">${tampered ? 'Undo the edit' : 'Try changing the health to ' + Math.min(99, Math.round(P.body.h + 17)) + '%'}</button>
  <p class="note" style="text-align:center">${tampered ? 'This is what a buyer sees if someone edits a passport.' : 'Shows what happens if someone edits a passport.'}</p>`;
  $('#tamper').onclick = () => { tampered = !tampered; render(); scrollTo({ top: 0, behavior: 'smooth' }); };
}
P = parse(); render();
addEventListener('hashchange', () => { P = parse(); tampered = false; render(); });
</script>
</body>
